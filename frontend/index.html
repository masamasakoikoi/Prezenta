<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prezenta 勤怠</title>
    <style>
      body { font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; padding: 16px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
      input { padding: 8px; }
      button { padding: 8px 10px; cursor: pointer; }
      pre { background: #111827; color: #e5e7eb; padding: 12px; border-radius: 10px; overflow:auto; }
      .toast { padding: 10px; border-radius: 10px; margin: 10px 0; display:none; white-space: pre-wrap; }
      .toast.ok { background: rgba(34,197,94,.12); }
      .toast.err { background: rgba(239,68,68,.12); }
      .box { border: 1px solid #e5e7eb; padding: 12px; border-radius: 10px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>勤怠</h1>
    <div>状態: <b id="status">-</b></div>

    <div id="toast" class="toast"></div>

    <div id="loginView" class="box">
      <h2>ログイン</h2>
      <div class="row">
        <input id="email" placeholder="email" />
        <input id="password" type="password" placeholder="password" />
        <button onclick="login()">ログイン</button>
      </div>
      <small>※ token は localStorage に保存されます</small>
    </div>

    <div id="appView" class="box" style="display:none;">
      <h2>操作</h2>
      <div class="row">
        <button onclick="start()">出勤</button>
        <button onclick="end()">退勤</button>
        <button onclick="refreshToday()">今日を更新</button>
        <button id="logoutBtn" onclick="logout()">ログアウト</button>
      </div>

      <h3>今日の勤怠</h3>
      <pre id="today">{}</pre>
    </div>

    <h3>直近レスポンス</h3>
    <pre id="result">{}</pre>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
